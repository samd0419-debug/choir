<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>호산나 찬양대 프리젠터</title>
    <!-- 인터넷 탭에 음표(🎵) 아이콘을 띄워주는 코드 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
    
    <style>
        body { 
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; 
            padding: 30px; 
            background-color: #f4f4f9;
        }
        #edit-mode { 
            max-width: 800px; 
            margin: 0 auto; 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { color: #333; margin-top: 0; }
        .description { color: #666; margin-bottom: 20px; line-height: 1.5; }
        
        .controls {
            display: flex;
            align-items: center;
            background: #e9ecef;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            gap: 15px;
        }
        
        input[type="range"] { flex-grow: 1; cursor: pointer; }

        textarea { 
            width: 100%; 
            height: 350px; 
            font-size: 18px; 
            padding: 15px; 
            margin-bottom: 20px; 
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: vertical;
        }
        
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { 
            padding: 12px 24px; 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer; 
            border: none;
            border-radius: 5px;
            color: white;
        }
        .btn-play { background-color: #4CAF50; }
        .btn-play:hover { background-color: #45a049; }
        .btn-save { background-color: #2196F3; }
        .btn-save:hover { background-color: #1e88e5; }
        .btn-load { background-color: #ff9800; }
        .btn-load:hover { background-color: #fb8c00; }
        
        #file-input { display: none; }

        /* 전체화면(프리젠테이션) 모드 스타일 */
        #presentation-mode {
            display: none;
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: black; color: white;
            text-align: center; 
            justify-content: center; 
            align-items: center;
            font-weight: bold;
            line-height: 1.4;
            z-index: 9999;
            padding: 50px;
            box-sizing: border-box;
            
            /* 마우스/터치 선택 방지 및 포인터 설정 */
            user-select: none;
            cursor: pointer;
            
            /* 문맥 맞춤 자동 줄바꿈 기술 */
            word-break: keep-all; 
            overflow-wrap: break-word;
            text-wrap: balance; 
        }
    </style>
</head>
<body>

<div id="edit-mode">
    <h2>🎵 호산나 찬양대 프리젠터</h2>
    <p class="description">
        <b>[엔터]</b>를 치면 새 화면으로 넘어갑니다. (강제 줄바꿈: <b>//</b>, 단어 묶기: <b>_</b>)<br>
        <b>[화면 넘기기]</b> 무선 포인터, 마우스 휠, 터치(화면 좌측 30% 이전 / 우측 70% 다음) 지원<br>
        <b>[긴급 복귀]</b> 마우스나 포인터, 화면 터치를 <b>빠르게 3번 다다닥!</b> 누르면 <b>첫 페이지</b>로 즉시 복귀<br>
        <b>[기타 조작]</b> <b>ESC</b>: 종료, <b>+ / -</b> : 글자 크기 실시간 조절
    </p>

    <div class="controls">
        <label for="font-size-slider"><b>🔍 글자 크기:</b></label>
        <input type="range" id="font-size-slider" min="3" max="15" value="8" step="0.5" oninput="updateFontSizeLabel()">
        <span id="font-size-label">8 (기본)</span>
    </div>
    
    <textarea id="lyrics-input" placeholder="내가 웃을 수 있는 건&#13;&#10;그의_눈물_때문이요&#13;&#10;&#13;&#10;(엔터를 치면 화면이 넘어갑니다.)"></textarea>
    
    <div class="btn-group">
        <button class="btn btn-play" onclick="startPresentation()">▶️ 전체화면 시작</button>
        <button class="btn btn-save" onclick="saveLyrics()">💾 텍스트로 저장</button>
        <button class="btn btn-load" onclick="document.getElementById('file-input').click()">📂 불러오기</button>
    </div>
    
    <input type="file" id="file-input" accept=".txt" onchange="loadLyrics(event)">
</div>

<div id="presentation-mode"></div>

<script>
    let slides = [];
    let currentSlideIndex = 0;
    let currentFontSize = 8; 
    let actionTimes = [];
    let wheelCooldown = false; 
    
    const editMode = document.getElementById('edit-mode');
    const presentationMode = document.getElementById('presentation-mode');
    const lyricsInput = document.getElementById('lyrics-input');
    const fontSizeSlider = document.getElementById('font-size-slider');
    const fontSizeLabel = document.getElementById('font-size-label');

    function updateFontSizeLabel() {
        currentFontSize = parseFloat(fontSizeSlider.value);
        fontSizeLabel.innerText = currentFontSize;
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function checkTripleAction() {
        const now = Date.now();
        actionTimes.push(now);
        actionTimes = actionTimes.filter(time => now - time < 800); 
        if (actionTimes.length >= 3) {
            actionTimes = []; 
            return true;
        }
        return false;
    }

    function goToFirstSlide() {
        if (slides.length > 0) {
            currentSlideIndex = 0;
            updateSlide();
        }
    }

    function startPresentation() {
        const text = lyricsInput.value.trim();
        if (!text) {
            alert('가사를 입력해주세요.');
            return;
        }
        
        slides = text.split('\n').map(line => line.trim()).filter(line => line !== '');
        
        if (slides.length === 0) {
            alert('유효한 가사가 없습니다.');
            return;
        }

        currentSlideIndex = 0;
        actionTimes = []; 
        
        currentFontSize = parseFloat(fontSizeSlider.value);
        presentationMode.style.fontSize = currentFontSize + 'vw';

        editMode.style.display = 'none';
        presentationMode.style.display = 'flex';
        updateSlide();

        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(err => console.log("전체화면 지원 안 됨"));
        }
    }

    function updateSlide() {
        if (slides.length > 0) {
            let safeText = escapeHtml(slides[currentSlideIndex]);
            safeText = safeText.replace(/\/\//g, '<br>');
            safeText = safeText.replace(/_/g, '&nbsp;');
            presentationMode.innerHTML = safeText;
        }
    }

    function exitPresentation() {
        presentationMode.style.display = 'none';
        editMode.style.display = 'block';
        if (document.fullscreenElement) {
            document.exitFullscreen().catch(err => console.log(err));
        }
    }

    // --- 마우스 클릭 & 모바일 터치 이벤트 (화면 분할) ---
    presentationMode.addEventListener('click', (e) => {
        if (checkTripleAction()) {
            goToFirstSlide();
            return;
        }
        
        // 클릭/터치한 X 좌표 확인
        const clickX = e.clientX;
        const screenWidth = window.innerWidth;

        // 화면 왼쪽 30% 터치 시 이전 슬라이드
        if (clickX < screenWidth * 0.3) {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                updateSlide();
            }
        } 
        // 나머지 오른쪽 영역 터치 시 다음 슬라이드
        else {
            if (currentSlideIndex < slides.length - 1) {
                currentSlideIndex++;
                updateSlide();
            }
        }
    });

    // 데스크톱 환경에서 우클릭 시 메뉴 뜨는 것 방지
    presentationMode.addEventListener('contextmenu', (e) => {
        e.preventDefault(); 
    });

    // --- 마우스 휠 이벤트 ---
    presentationMode.addEventListener('wheel', (e) => {
        if (wheelCooldown) return;
        wheelCooldown = true;
        
        if (e.deltaY > 0) {
            if (currentSlideIndex < slides.length - 1) {
                currentSlideIndex++;
                updateSlide();
            }
        } else if (e.deltaY < 0) {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                updateSlide();
            }
        }
        
        setTimeout(() => {
            wheelCooldown = false;
        }, 200); 
    });

    // --- 키보드 및 무선 포인터 이벤트 ---
    document.addEventListener('keydown', (e) => {
        if (presentationMode.style.display === 'flex') {
            if (e.key === '+' || e.key === '=') {
                if (currentFontSize < 15) currentFontSize += 0.5;
                presentationMode.style.fontSize = currentFontSize + 'vw';
                fontSizeSlider.value = currentFontSize;
                updateFontSizeLabel();
            }
            else if (e.key === '-' || e.key === '_') {
                if (currentFontSize > 3) currentFontSize -= 0.5;
                presentationMode.style.fontSize = currentFontSize + 'vw';
                fontSizeSlider.value = currentFontSize;
                updateFontSizeLabel();
            }
            else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ' || e.key === 'Enter') {
                e.preventDefault(); 
                if (checkTripleAction()) {
                    goToFirstSlide();
                    return;
                }
                if (currentSlideIndex < slides.length - 1) {
                    currentSlideIndex++;
                    updateSlide();
                }
            }
            else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
                e.preventDefault(); 
                if (checkTripleAction()) {
                    goToFirstSlide();
                    return;
                }
                if (currentSlideIndex > 0) {
                    currentSlideIndex--;
                    updateSlide();
                }
            }
            else if (e.key === 'Escape') {
                exitPresentation();
            }
        }
    });

    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement && presentationMode.style.display === 'flex') {
            exitPresentation();
        }
    });

    // --- 파일 저장 및 불러오기 ---
    function saveLyrics() {
        const text = lyricsInput.value;
        if (!text) {
            alert('저장할 가사가 없습니다.');
            return;
        }
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '호산나찬양대_가사.txt';
        a.click();
        URL.revokeObjectURL(a.href);
    }

    function loadLyrics(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            lyricsInput.value = e.target.result;
        };
        reader.readAsText(file, "UTF-8");
        event.target.value = '';
    }
</script>
</body>
</html>
