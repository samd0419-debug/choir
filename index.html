<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>호산나 찬양대 프리젠터</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
    
    <style>
        body { 
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; 
            padding: 30px; 
            background-color: #f4f4f9;
        }
        #edit-mode { 
            max-width: 800px; 
            margin: 0 auto; 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { color: #333; margin-top: 0; }
        .description { color: #666; margin-bottom: 20px; line-height: 1.5; }
        
        .controls {
            display: flex;
            align-items: center;
            background: #e9ecef;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            gap: 15px;
        }
        
        input[type="range"] { flex-grow: 1; cursor: pointer; }

        textarea { 
            width: 100%; 
            height: 350px; 
            font-size: 18px; 
            padding: 15px; 
            margin-bottom: 20px; 
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: vertical;
            background-color: #fffff8; /* 자동 저장되는 느낌을 주는 따뜻한 배경색 */
        }
        
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { 
            padding: 12px 24px; 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer; 
            border: none;
            border-radius: 5px;
            color: white;
        }
        .btn-play { background-color: #4CAF50; }
        .btn-play:hover { background-color: #45a049; }
        .btn-save { background-color: #2196F3; }
        .btn-save:hover { background-color: #1e88e5; }
        .btn-load { background-color: #ff9800; }
        .btn-load:hover { background-color: #fb8c00; }
        
        #file-input { display: none; }
        #save-status { margin-left: 10px; font-size: 14px; color: #2196F3; font-weight: bold; }

        /* 전체화면(프리젠테이션) 모드 스타일 */
        #presentation-mode {
            display: none;
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: black; color: white;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            font-weight: bold;
            line-height: 1.4;
            z-index: 9999;
            padding: 50px;
            box-sizing: border-box;
            user-select: none;
            cursor: pointer;
        }

        #exit-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.3); 
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 8px;
            font-family: 'Malgun Gothic', sans-serif;
            z-index: 10000;
        }

        #slide-text {
            text-align: center;
            word-break: keep-all; 
            overflow-wrap: break-word;
            text-wrap: balance; 
            width: 100%;
        }

        #page-number {
            position: absolute;
            bottom: 30px;
            right: 40px;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: normal;
            font-family: Arial, sans-serif;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div id="edit-mode">
    <h2>🎵 호산나 찬양대 프리젠터</h2>
    <p class="description">
        <b>[자동 저장 중 💾]</b> 글자를 쓰면 앱을 꺼도 기기가 스스로 기억합니다!<br>
        <b>[스마트폰 공유]</b> 저장 버튼을 누르면 카톡이나 구글 드라이브 앱으로 바로 보낼 수 있습니다.
    </p>

    <div class="controls">
        <label for="font-size-slider"><b>🔍 글자 크기:</b></label>
        <input type="range" id="font-size-slider" min="3" max="15" value="8" step="0.5" oninput="updateFontSizeLabel()">
        <span id="font-size-label">8 (기본)</span>
        <span id="save-status"></span>
    </div>
    
    <textarea id="lyrics-input" placeholder="260908_은혜 (첫 줄은 파일명으로 저장됩니다)&#13;&#10;&#13;&#10;내가 웃을 수 있는 건&#13;&#10;그의_눈물_때문이요"></textarea>
    
    <div class="btn-group">
        <button class="btn btn-play" onclick="startPresentation()">▶️ 전체화면 시작</button>
        <button class="btn btn-save" onclick="saveLyrics()">📥 텍스트 저장 / 공유</button>
        <button class="btn btn-load" onclick="document.getElementById('file-input').click()">📂 불러오기</button>
    </div>
    
    <input type="file" id="file-input" accept=".txt" onchange="loadLyrics(event)">
</div>

<div id="presentation-mode">
    <div id="exit-btn" onclick="exitPresentation(event)" ontouchstart="event.stopPropagation()">✖ 종료</div>
    <div id="slide-text"></div>
    <div id="page-number"></div>
</div>

<script>
    let slides = [];
    let currentSlideIndex = 0;
    let currentFontSize = 8; 
    let wheelCooldown = false; 
    let tapCount = 0;
    let tapTimeout;
    let touchStartX = 0, touchStartY = 0, touchEndX = 0, touchEndY = 0;
    let isSwiping = false;
    
    const editMode = document.getElementById('edit-mode');
    const presentationMode = document.getElementById('presentation-mode');
    const slideText = document.getElementById('slide-text');
    const pageNumber = document.getElementById('page-number');
    const lyricsInput = document.getElementById('lyrics-input');
    const fontSizeSlider = document.getElementById('font-size-slider');
    const fontSizeLabel = document.getElementById('font-size-label');
    const saveStatus = document.getElementById('save-status');

    // --- 💡 핵심 기능 1: 실시간 자동 저장 ---
    // 창을 열었을 때 기기에 기억된 가사가 있으면 불러옵니다.
    window.onload = function() {
        const savedLyrics = localStorage.getItem('hosannaLyrics');
        if (savedLyrics) {
            lyricsInput.value = savedLyrics;
        }
    };

    // 글자를 칠 때마다 실시간으로 기기에 저장합니다.
    lyricsInput.addEventListener('input', function() {
        localStorage.setItem('hosannaLyrics', lyricsInput.value);
        saveStatus.innerText = "✓ 자동 저장됨";
        setTimeout(() => { saveStatus.innerText = ""; }, 2000); // 2초 뒤 알림 숨김
    });

    function updateFontSizeLabel() {
        currentFontSize = parseFloat(fontSizeSlider.value);
        fontSizeLabel.innerText = currentFontSize;
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function goToFirstSlide() {
        if (slides.length > 0) { currentSlideIndex = 0; updateSlide(); }
    }

    function startPresentation() {
        const text = lyricsInput.value.trim();
        if (!text) { alert('가사를 입력해주세요.'); return; }
        
        slides = text.split('\n').map(line => line.trim()).filter(line => line !== '');
        if (slides.length === 0) return;

        currentSlideIndex = 0; tapCount = 0; isSwiping = false;
        currentFontSize = parseFloat(fontSizeSlider.value);
        slideText.style.fontSize = currentFontSize + 'vw';

        editMode.style.display = 'none';
        presentationMode.style.display = 'flex';
        updateSlide();
        
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(err => console.log("전체화면 지원 안 됨"));
        }
    }

    function updateSlide() {
        if (slides.length > 0) {
            let safeText = escapeHtml(slides[currentSlideIndex]);
            safeText = safeText.replace(/\/\//g, '<br>');
            safeText = safeText.replace(/_/g, '&nbsp;');
            slideText.innerHTML = safeText;
            pageNumber.innerText = (currentSlideIndex + 1) + " / " + slides.length;
        }
    }

    function exitPresentation(e) {
        if(e) e.stopPropagation(); 
        presentationMode.style.display = 'none';
        editMode.style.display = 'block';
        if (document.fullscreenElement) {
            document.exitFullscreen().catch(err => console.log(err));
        }
    }

    // --- 스와이프 및 터치 로직 (이전과 동일) ---
    presentationMode.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
        isSwiping = false; 
    }, {passive: true});

    presentationMode.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        touchEndY = e.changedTouches[0].screenY;
        handleSwipe();
    });

    function handleSwipe() {
        const swipeThreshold = 50; 
        const deltaX = touchEndX - touchStartX;
        const deltaY = touchEndY - touchStartY;
        
        if (Math.abs(deltaX) > swipeThreshold || Math.abs(deltaY) > swipeThreshold) {
            isSwiping = true; 
            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (deltaX < 0) { if (currentSlideIndex < slides.length - 1) { currentSlideIndex++; updateSlide(); } } 
                else { if (currentSlideIndex > 0) { currentSlideIndex--; updateSlide(); } }
            } else {
                if (deltaY < 0) { if (currentSlideIndex < slides.length - 1) { currentSlideIndex++; updateSlide(); } } 
                else { if (currentSlideIndex > 0) { currentSlideIndex--; updateSlide(); } }
            }
        }
    }

    presentationMode.addEventListener('click', (e) => {
        if (isSwiping) { isSwiping = false; return; }
        tapCount++;
        if (tapCount === 1) {
            tapTimeout = setTimeout(() => {
                if (currentSlideIndex < slides.length - 1) { currentSlideIndex++; updateSlide(); }
                tapCount = 0; 
            }, 300); 
        } else if (tapCount === 2) {
            clearTimeout(tapTimeout);
            tapTimeout = setTimeout(() => {
                if (currentSlideIndex > 0) { currentSlideIndex--; updateSlide(); }
                tapCount = 0; 
            }, 300);
        } else if (tapCount >= 3) {
            clearTimeout(tapTimeout);
            goToFirstSlide(); tapCount = 0; 
        }
    });

    presentationMode.addEventListener('contextmenu', (e) => { e.preventDefault(); });

    presentationMode.addEventListener('wheel', (e) => {
        if (wheelCooldown) return;
        wheelCooldown = true;
        if (e.deltaY > 0) { if (currentSlideIndex < slides.length - 1) { currentSlideIndex++; updateSlide(); } } 
        else if (e.deltaY < 0) { if (currentSlideIndex > 0) { currentSlideIndex--; updateSlide(); } }
        setTimeout(() => { wheelCooldown = false; }, 200); 
    });

    document.addEventListener('keydown', (e) => {
        if (presentationMode.style.display === 'flex') {
            if (e.key === '+' || e.key === '=') {
                if (currentFontSize < 15) currentFontSize += 0.5;
                slideText.style.fontSize = currentFontSize + 'vw';
                fontSizeSlider.value = currentFontSize; updateFontSizeLabel();
            } else if (e.key === '-' || e.key === '_') {
                if (currentFontSize > 3) currentFontSize -= 0.5;
                slideText.style.fontSize = currentFontSize + 'vw';
                fontSizeSlider.value = currentFontSize; updateFontSizeLabel();
            } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ' || e.key === 'Enter') {
                e.preventDefault(); if (currentSlideIndex < slides.length - 1) { currentSlideIndex++; updateSlide(); }
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
                e.preventDefault(); if (currentSlideIndex > 0) { currentSlideIndex--; updateSlide(); }
            } else if (e.key === 'Escape') { exitPresentation(); }
        }
    });

    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement && presentationMode.style.display === 'flex') { exitPresentation(); }
    });

    // --- 💡 핵심 기능 2: 스마트 공유 및 저장 (버그 우회) ---
    function saveLyrics() {
        const text = lyricsInput.value.trim();
        if (!text) { alert('저장할 가사가 없습니다.'); return; }

        let firstLine = text.split('\n')[0].trim();
        firstLine = firstLine.replace(/[\/\\?%*:|"<>]/g, '');
        let fileName = firstLine ? firstLine + '.txt' : '호산나찬양대_가사.txt';
        
        const file = new File([text], fileName, { type: 'text/plain' });

        // 아이폰/아이패드 환경이면 에러나는 '파일' 앱 대신 '공유하기' 창을 띄워버립니다!
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({
                title: fileName,
                files: [file]
            }).catch(err => console.log('공유 취소됨'));
        } 
        // 데스크톱(PC) 환경에서는 기존처럼 파일로 바로 다운로드합니다.
        else {
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(a.href);
        }
    }

    function loadLyrics(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            lyricsInput.value = e.target.result;
            // 불러온 내용도 즉시 기기에 자동 저장
            localStorage.setItem('hosannaLyrics', lyricsInput.value); 
        };
        reader.readAsText(file, "UTF-8");
        event.target.value = '';
    }
</script>
</body>
</html>
