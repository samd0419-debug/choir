<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>호산나 찬양대 프리젠터</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
    
    <style>
        body { 
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; 
            padding: 20px; 
            background-color: #f0f2f5;
            margin: 0; 
            box-sizing: border-box;
        }
        #edit-mode { 
            max-width: 1400px; 
            margin: 0 auto; 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            box-sizing: border-box;
            min-height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
        }
        
        h2 { 
            color: #333; 
            margin-top: 0; 
            margin-bottom: 8px;
            font-size: 24px;
        }
        .description { 
            color: #666; 
            margin-bottom: 15px; 
            line-height: 1.5; 
            font-size: 14px;
        }
        
        .controls {
            display: flex;
            align-items: center;
            background: #e9ecef;
            padding: 12px 18px;
            border-radius: 6px;
            margin-bottom: 15px;
            gap: 15px;
        }
        input[type="range"] { flex-grow: 1; cursor: pointer; }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .btn { 
            padding: 12px 22px; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            border: none;
            border-radius: 6px;
            color: white;
            transition: background-color 0.15s ease;
        }
        .btn-play { background-color: #4CAF50; font-size: 18px; padding: 12px 28px; }
        .btn-play:hover { background-color: #45a049; }
        .btn-save { background-color: #2196F3; }
        .btn-save:hover { background-color: #1e88e5; }
        .btn-load { background-color: #ff9800; }
        .btn-load:hover { background-color: #fb8c00; }
        
        #file-input { display: none; }
        #save-status { margin-left: 10px; font-size: 14px; color: #2196F3; font-weight: bold; }

        /* 좌우 분할 작업 영역 */
        .workspace {
            display: flex;
            gap: 20px;
            flex-grow: 1;
            align-items: stretch;
        }

        .editor-section {
            flex: 1.1;
            display: flex;
            flex-direction: column;
        }

        textarea { 
            width: 100%; 
            flex-grow: 1;
            min-height: 520px; 
            font-size: 18px; 
            line-height: 1.6;
            padding: 18px; 
            box-sizing: border-box;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            resize: vertical;
            background-color: #fffff8; 
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }
        textarea:focus {
            outline: none;
            border-color: #3182ce;
        }

        /* 우측 실시간 16:9 미리보기 섹션 */
        .preview-section {
            flex: 0.9;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .preview-header {
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 14px;
            overflow-y: auto;
            max-height: 580px;
            padding-right: 5px;
        }

        /* 16:9 미니어처 타일 */
        .preview-tile {
            aspect-ratio: 16 / 9;
            background: #000000;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            cursor: pointer;
            border: 2px solid transparent;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: transform 0.15s, border-color 0.15s;
        }
        .preview-tile:hover {
            transform: scale(1.02);
            border-color: #4CAF50;
        }

        .tile-badge {
            position: absolute;
            top: 6px;
            left: 8px;
            background: rgba(255,255,255,0.25);
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            color: #e2e8f0;
            font-weight: normal;
        }

        .tile-lines-badge {
            position: absolute;
            top: 6px;
            right: 8px;
            background: rgba(43, 108, 176, 0.8);
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
        }

        .tile-text {
            font-size: 12px;
            line-height: 1.4;
            font-weight: bold;
            white-space: pre-wrap;
            word-break: keep-all;
            pointer-events: none;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 4;
        }

        /* 전체화면 프리젠테이션 모드 */
        #presentation-mode {
            display: none;
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0; 
            width: 100vw; height: 100vh;
            background-color: black; color: white;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            font-weight: bold;
            z-index: 9999;
            box-sizing: border-box;
            user-select: none;
            cursor: none; 
            overflow: hidden;
        }

        #cover-image-fs {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain; 
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        #exit-btn {
            position: absolute;
            top: max(30px, env(safe-area-inset-top));
            right: max(40px, env(safe-area-inset-right));
            font-size: 20px;
            color: rgba(255, 255, 255, 0.4); 
            background: rgba(255, 255, 255, 0.12);
            padding: 10px 18px;
            border-radius: 8px;
            font-family: 'Malgun Gothic', sans-serif;
            z-index: 10000;
            cursor: pointer;
        }

        #slide-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 88vw;
            height: 76vh;
            box-sizing: border-box;
            z-index: 2;
        }

        #slide-text {
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
        }

        .slide-line {
            white-space: nowrap;
            display: block;
        }

        #page-number {
            position: absolute;
            bottom: max(30px, env(safe-area-inset-bottom));
            right: max(40px, env(safe-area-inset-right));
            font-size: 40px; 
            color: rgba(255, 255, 255, 0.3);
            font-weight: normal;
            font-family: Arial, sans-serif;
            letter-spacing: 2px;
            z-index: 2;
        }
    </style>
</head>
<body>

<div id="edit-mode">
    <h2>🎵 호산나 찬양대 프리젠터</h2>
    <p class="description">
        <b>[16:9 실시간 타일 🖥️]</b> 왼쪽에서 빈 줄(엔터 두 번)로 가사를 나누면, 오른쪽에 16:9 프리뷰 카드가 실시간 생성됩니다.<br>
        <b>[포인터 조작 🕹️]</b> <b>다음(▶):</b> 다음 슬라이드 / <b>이전(◀):</b> 이전 슬라이드 / <b>다음 길게:</b> 첫 화면(표지) / <b>이전 길게:</b> 종료
    </p>

    <div class="controls">
        <label for="font-size-slider"><b>🔍 최대 상한 크기:</b></label>
        <input type="range" id="font-size-slider" min="4" max="15" value="8.5" step="0.5" oninput="updateFontSizeLabel()">
        <span id="font-size-label">8.5 (기본)</span>
        <span id="save-status"></span>
    </div>

    <div class="btn-group">
        <button class="btn btn-play" onclick="startPresentation(0)">▶️ 전체화면 시작</button>
        <button class="btn btn-save" onclick="saveLyrics()">💾 파일로 저장</button>
        <button class="btn btn-load" onclick="document.getElementById('file-input').click()">📂 불러오기</button>
    </div>
    
    <input type="file" id="file-input" accept=".txt" onchange="loadLyrics(event)">

    <div class="workspace">
        <div class="editor-section">
            <textarea id="lyrics-input" placeholder="곡 제목 (첫 줄에 제목을 적고 빈 줄을 넣으면 표지 뒤 첫 파일명이 됩니다)&#13;&#10;&#13;&#10;가사 1페이지 1행&#13;&#10;가사 1페이지 2행&#13;&#10;&#13;&#10;가사 2페이지 1행&#13;&#10;가사 2페이지 2행&#13;&#10;가사 2페이지 3행"></textarea>
        </div>

        <div class="preview-section">
            <div class="preview-header">
                <span>실시간 16:9 슬라이드 프리뷰</span>
                <span id="preview-count" style="font-size: 13px; color: #718096;">총 0페이지</span>
            </div>
            <div class="preview-grid" id="preview-grid"></div>
        </div>
    </div>
</div>

<div id="presentation-mode">
    <div id="exit-btn" onclick="exitPresentation(event)" ontouchstart="event.stopPropagation()">✖ 종료</div>
    <img id="cover-image-fs" src="메인2.jpg" alt="호산나 찬양대 표지 화면">
    
    <div id="slide-container">
        <div id="slide-text"></div>
    </div>
    <div id="page-number"></div>
</div>

<script>
    let slides = [];
    let currentSlideIndex = 0;
    let currentFontSize = 8.5; 
    let wheelCooldown = false; 
    let tapCount = 0;
    let tapTimeout;
    let touchStartX = 0, touchStartY = 0, touchEndX = 0, touchEndY = 0;
    let isSwiping = false;
    
    const editMode = document.getElementById('edit-mode');
    const presentationMode = document.getElementById('presentation-mode');
    const lyricsInput = document.getElementById('lyrics-input');
    const previewGrid = document.getElementById('preview-grid');
    const previewCount = document.getElementById('preview-count');
    const slideContainer = document.getElementById('slide-container');
    const slideText = document.getElementById('slide-text');
    const pageNumber = document.getElementById('page-number');
    const coverImageFS = document.getElementById('cover-image-fs');
    const fontSizeSlider = document.getElementById('font-size-slider');
    const fontSizeLabel = document.getElementById('font-size-label');
    const saveStatus = document.getElementById('save-status');

    window.onload = function() {
        const savedLyrics = localStorage.getItem('hosannaLyrics');
        if (savedLyrics) {
            lyricsInput.value = savedLyrics;
        }
        
        const savedFontSize = localStorage.getItem('hosannaFontSize');
        if (savedFontSize) {
            currentFontSize = parseFloat(savedFontSize);
            fontSizeSlider.value = currentFontSize;
            fontSizeLabel.innerText = currentFontSize;
        }

        renderPreviewTiles();
    };

    lyricsInput.addEventListener('input', function() {
        localStorage.setItem('hosannaLyrics', lyricsInput.value);
        saveStatus.innerText = "✓ 가사 자동 저장됨";
        setTimeout(() => { saveStatus.innerText = ""; }, 1500);
        renderPreviewTiles();
    });

    // 💡 우측에 16:9 미니어처 타일을 실시간으로 그리는 함수
    function renderPreviewTiles() {
        const text = lyricsInput.value.trim();
        previewGrid.innerHTML = '';

        if (!text) {
            previewCount.innerText = '총 0페이지';
            return;
        }

        const rawBlocks = text.split(/\n\s*\n+/).map(b => b.trim()).filter(b => b.length > 0);
        previewCount.innerText = `총 ${rawBlocks.length}페이지`;

        rawBlocks.forEach((block, idx) => {
            const lines = block.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
            const tile = document.createElement('div');
            tile.className = 'preview-tile';
            tile.title = '클릭하면 이 페이지부터 시작합니다';

            tile.innerHTML = `
                <div class="tile-badge">#${idx + 1}</div>
                <div class="tile-lines-badge">${lines.length}줄</div>
                <div class="tile-text">${escapeHtml(block)}</div>
            `;

            // 타일 클릭 시 해당 페이지로 바로 전체화면 시작
            tile.addEventListener('click', () => {
                startPresentation(idx + 1);
            });

            previewGrid.appendChild(tile);
        });
    }

    function updateFontSizeLabel() {
        currentFontSize = parseFloat(fontSizeSlider.value);
        fontSizeLabel.innerText = currentFontSize;
        localStorage.setItem('hosannaFontSize', currentFontSize);
        if (presentationMode.style.display === 'flex') {
            updateSlide();
        }
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function goToFirstSlide() {
        if (slides.length > 0) { currentSlideIndex = 0; updateSlide(); }
    }

    function startPresentation(startIndex = 0) {
        const text = lyricsInput.value.trim();
        if (!text) { alert('가사를 입력해주세요.'); return; }
        
        const rawBlocks = text.split(/\n\s*\n+/);
        slides = rawBlocks
            .map(block => block.trim())
            .filter(block => block.length > 0);

        if (slides.length === 0) return;

        slides.unshift('__COVER_IMAGE__');

        currentSlideIndex = startIndex; 
        tapCount = 0; 
        isSwiping = false;
        currentFontSize = parseFloat(fontSizeSlider.value);

        document.body.style.backgroundColor = 'black'; 
        editMode.style.display = 'none';
        presentationMode.style.display = 'flex';
        updateSlide();
        
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(err => console.log("전체화면 지원 안 됨"));
        }
    }

    function autoFitSlideText(lineCount) {
        const maxW = slideContainer.clientWidth;
        const maxH = slideContainer.clientHeight;

        slideText.style.lineHeight = lineCount <= 2 ? '1.45' : '1.32';

        const maxAllowedPx = (window.innerWidth * currentFontSize) / 100;
        let low = 24;
        let high = maxAllowedPx;
        let best = low;

        for (let i = 0; i < 9; i++) {
            const mid = (low + high) / 2;
            slideText.style.fontSize = mid + 'px';

            const fits = (slideText.scrollWidth <= maxW) && (slideText.scrollHeight <= maxH);
            if (fits) {
                best = mid;
                low = mid + 0.5;
            } else {
                high = mid - 0.5;
            }
        }
        slideText.style.fontSize = best + 'px';
    }

    function updateSlide() {
        if (slides.length > 0) {
            const currentContent = slides[currentSlideIndex];

            if (currentContent === '__COVER_IMAGE__') {
                coverImageFS.style.display = 'block'; 
                slideContainer.style.display = 'none';     
                pageNumber.style.display = 'none';    
            } else {
                coverImageFS.style.display = 'none';  
                slideContainer.style.display = 'flex';    
                pageNumber.style.display = 'block';   

                const lines = currentContent.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
                const formattedHtml = lines.map(line => {
                    let s = escapeHtml(line);
                    s = s.replace(/_/g, '&nbsp;');
                    return `<span class="slide-line">${s}</span>`;
                }).join('');

                slideText.innerHTML = formattedHtml;
                autoFitSlideText(lines.length);

                pageNumber.innerText = currentSlideIndex + " / " + (slides.length - 1);
            }
        }
    }

    window.addEventListener('resize', () => {
        if (presentationMode.style.display === 'flex') {
            updateSlide();
        }
    });

    function exitPresentation(e) {
        if(e) e.stopPropagation(); 
        presentationMode.style.display = 'none';
        editMode.style.display = 'flex';
        document.body.style.backgroundColor = '#f0f2f5'; 
        if (document.fullscreenElement) {
            document.exitFullscreen().catch(err => console.log(err));
        }
    }

    presentationMode.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
        isSwiping = false; 
    }, {passive: true});

    presentationMode.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        touchEndY = e.changedTouches[0].screenY;
        handleSwipe();
    });

    function handleSwipe() {
        const swipeThreshold = 50; 
        const deltaX = touchEndX - touchStartX;
        const deltaY = touchEndY - touchStartY;
        
        if (Math.abs(deltaX) > swipeThreshold || Math.abs(deltaY) > swipeThreshold) {
            isSwiping = true; 
            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (deltaX < 0) { if (currentSlideIndex < slides.length - 1) { currentSlideIndex++; updateSlide(); } } 
                else { if (currentSlideIndex > 0) { currentSlideIndex--; updateSlide(); } }
            } else {
                if (deltaY < 0) { if (currentSlideIndex < slides.length - 1) { currentSlideIndex++; updateSlide(); } } 
                else { if (currentSlideIndex > 0) { currentSlideIndex--; updateSlide(); } }
            }
        }
    }

    presentationMode.addEventListener('click', (e) => {
        if (isSwiping) { isSwiping = false; return; }
        tapCount++;
        if (tapCount === 1) {
            tapTimeout = setTimeout(() => {
                if (currentSlideIndex < slides.length - 1) { currentSlideIndex++; updateSlide(); }
                tapCount = 0; 
            }, 300); 
        } else if (tapCount === 2) {
            clearTimeout(tapTimeout);
            tapTimeout = setTimeout(() => {
                if (currentSlideIndex > 0) { currentSlideIndex--; updateSlide(); }
                tapCount = 0; 
            }, 300);
        } else if (tapCount >= 3) {
            clearTimeout(tapTimeout);
            goToFirstSlide(); 
            tapCount = 0; 
        }
    });

    presentationMode.addEventListener('contextmenu', (e) => { e.preventDefault(); });

    presentationMode.addEventListener('wheel', (e) => {
        if (wheelCooldown) return;
        wheelCooldown = true;
        if (e.deltaY > 0) { if (currentSlideIndex < slides.length - 1) { currentSlideIndex++; updateSlide(); } } 
        else if (e.deltaY < 0) { if (currentSlideIndex > 0) { currentSlideIndex--; updateSlide(); } }
        setTimeout(() => { wheelCooldown = false; }, 200); 
    });

    document.addEventListener('keydown', (e) => {
        if (presentationMode.style.display === 'flex') {
            if (e.key === '+' || e.key === '=') {
                if (currentFontSize < 15) currentFontSize += 0.5;
                fontSizeSlider.value = currentFontSize; 
                updateFontSizeLabel();
            } else if (e.key === '-' || e.key === '_') {
                if (currentFontSize > 4) currentFontSize -= 0.5;
                fontSizeSlider.value = currentFontSize; 
                updateFontSizeLabel();
            } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ' || e.key === 'Enter') {
                e.preventDefault(); if (currentSlideIndex < slides.length - 1) { currentSlideIndex++; updateSlide(); }
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
                e.preventDefault(); if (currentSlideIndex > 0) { currentSlideIndex--; updateSlide(); }
            } 
            else if (e.key === 'Escape') { 
                exitPresentation(); 
            } 
            else if (e.key.toLowerCase() === 'b' || e.key === '.' || e.key === 'F5' || e.key === 'Home') {
                e.preventDefault();
                goToFirstSlide();
            }
        } 
        else {
            const isTyping = document.activeElement === lyricsInput;
            if (!isTyping) {
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
                    e.preventDefault();
                    startPresentation(0);
                }
            }
        }
    });

    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement && presentationMode.style.display === 'flex') { exitPresentation(); }
    });

    async function saveLyrics() {
        const text = lyricsInput.value.trim();
        if (!text) { alert('저장할 가사가 없습니다.'); return; }

        let firstLine = text.split('\n')[0].trim();
        firstLine = firstLine.replace(/[\/\\?%*:|"<>]/g, '');
        let fileName = firstLine ? firstLine + '.txt' : '호산나찬양대_가사.txt';
        
        try {
            if (window.showSaveFilePicker) {
                const handle = await window.showSaveFilePicker({
                    suggestedName: fileName,
                    types: [{
                        description: '텍스트 파일',
                        accept: {'text/plain': ['.txt']},
                    }],
                });
                const writable = await handle.createWritable();
                await writable.write(text);
                await writable.close();
                return;
            }
        } catch (err) {
            if (err.name !== 'AbortError') console.error(err);
            return;
        }

        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(a.href);
    }

    function loadLyrics(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            lyricsInput.value = e.target.result;
            localStorage.setItem('hosannaLyrics', lyricsInput.value); 
            renderPreviewTiles();
        };
        reader.readAsText(file, "UTF-8");
        event.target.value = '';
    }
</script>
</body>
</html>
